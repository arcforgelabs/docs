name: Pages

# Builds the site from the mirrored docs trees and deploys it to GitHub Pages.
# docs-sync-publish.yml in each product repo pushes the mirror to main, which
# starts this run. openclaw/docs does the same with r2-pages.yml and a
# Cloudflare Worker; this site uses GitHub Pages instead.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".arcforge-sync/**"
      - "scripts/docs-site/**"
      - "site.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # base_path is /docs for arcforgelabs.github.io/docs, and empty once a
      # custom domain is set, so links follow the Pages setting.
      - name: Build and smoke
        env:
          DOCS_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run docs:check

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
