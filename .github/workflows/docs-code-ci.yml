name: Docs Code CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".arcforge-sync/**"

permissions:
  contents: read

concurrency:
  group: docs-code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and smoke
        env:
          DOCS_SITE_BASE: /docs/
        run: npm run docs:check
